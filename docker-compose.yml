# 로컬 개발용 인프라 (PostgreSQL + Redis)
# 사용: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: woojuin-postgres
    environment:
      POSTGRES_DB: woojuin
      POSTGRES_USER: woojuin
      POSTGRES_PASSWORD: woojuin-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: woojuin-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
