# 우주인 GitLab CI
# 전략: 모노레포라서 rules:changes 로 변경된 파트만 빌드
# 스테이지: lint/test → build → (배포는 인프라 세팅 후 deploy 잡 추가 예정)

# 파이프라인 생성 조건: MR(develop/main 대상 포함) 또는 main 브랜치 push/머지 시에만.
# feature/* 브랜치에 단독 push할 때는 파이프라인 자체가 생성되지 않음.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# ---------- Frontend (웹앱) ----------
frontend-test:
  stage: test
  image: node:20-alpine
  rules:
    - changes:
        - frontend/**/*
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run type-check

frontend-build:
  stage: build
  image: node:20-alpine
  rules:
    - changes:
        - frontend/**/*
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
    policy: pull
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ---------- Extension (크롬 익스텐션) ----------
extension-build:
  stage: build
  image: node:20-alpine
  rules:
    - changes:
        - extension/**/*
  script:
    - cd extension
    - npm ci
    - npm run build
  artifacts:
    paths:
      - extension/dist/
    expire_in: 1 week

# ---------- Backend (Spring Boot) ----------
backend-test:
  stage: test
  image: gradle:8.8-jdk21
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - gradle test --no-daemon

backend-build:
  stage: build
  image: gradle:8.8-jdk21
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - gradle bootJar --no-daemon
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week

# ---------- Deploy (추후) ----------
# EC2/Docker 배포 잡은 인프라 세팅 완료 후 추가:
#   - docker build & push
#   - ssh로 EC2에서 compose pull & up
#   - main 브랜치 merge 시에만 실행 (rules: if $CI_COMMIT_BRANCH == "main")
