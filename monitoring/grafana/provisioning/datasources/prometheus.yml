# Grafana 데이터소스 자동 등록 — 컨테이너가 뜰 때 Prometheus 가 이미 연결돼 있다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # 로그. Prometheus 와 같은 화면에서 메트릭 ↔ 로그를 왕복할 수 있다.
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
