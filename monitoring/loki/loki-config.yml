# Loki — 로그 보존·검색. 단일 바이너리 + 파일시스템 저장(작은 서버 한 대짜리 구성).
#
# Dozzle 로는 부족한 이유: 그건 docker 가 들고 있는 로그를 실시간으로 보여 줄 뿐이라,
# 배포로 컨테이너가 교체되면 그 로그도 함께 사라진다. 배포 뒤에 "아까 그 에러"를 볼 수 없다.
# Promtail 이 로그를 실시간으로 여기에 밀어 넣으므로 컨테이너가 사라져도 남는다.
#
# 오브젝트 스토리지(S3/MinIO)를 쓰지 않은 이유: 서버 한 대에 로그량도 작아서 파일시스템이면
# 충분하고, MinIO 를 쓰면 앱 스택 장애가 모니터링까지 끌고 들어간다(조사할 때 필요한 도구가
# 같이 죽으면 안 된다).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # info 로 두면 Loki 자기 로그가 초당 여러 줄씩 나와 Dozzle 이 지저분해진다
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 보존 기간 14일. Prometheus 메트릭(15일)과 대략 맞췄다 — 같은 사건을 로그·메트릭으로
  # 함께 되짚을 수 있어야 한다.
  retention_period: 336h
  # 컨테이너가 오래 멈췄다 살아나며 과거 로그를 쏟아내는 경우를 막는다
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # 우리 라벨은 stack/service/container/stream 넷뿐이라 넉넉하다
  max_label_names_per_series: 15

compactor:
  working_directory: /loki/compactor
  # 이게 없으면 retention_period 를 적어도 실제로 지워지지 않는다(디스크가 계속 찬다)
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# 사용량 통계 전송 끄기 — 외부로 나가는 트래픽을 만들지 않는다
analytics:
  reporting_enabled: false
