# Promtail — 도커 컨테이너 로그를 실시간으로 Loki 에 보낸다.
#
# 파일(/var/lib/docker/containers/*.log)을 직접 읽지 않고 **도커 API 로 발견·수집**한다:
#  - 배포 때마다 컨테이너가 새로 만들어지는데(백엔드·aimix·크롤러), API 발견이면 새 컨테이너를
#    자동으로 따라잡는다. 파일 경로 방식은 컨테이너 id 가 바뀔 때마다 놓친다
#  - 로그 로테이션에 영향을 받지 않는다
#
# 라벨은 compose 가 붙여 주는 것을 그대로 쓴다 — Grafana 에서 {stack="woojuin-prod"} 처럼
# 환경별로, {service="backend"} 처럼 서비스별로 바로 걸러 볼 수 있다.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        # 배포 직후 새 컨테이너를 빨리 잡도록 짧게 둔다
        refresh_interval: 10s
        # ── prod 스택만 수집한다 ──────────────────────────────────────────────
        # dev·Jenkins·모니터링 자기 로그는 Dozzle 로 실시간으로만 본다. 이유:
        #  - 사후 조사가 필요한 건 운영 장애다. dev 는 고치는 중이라 대체로 실시간으로 본다
        #  - Jenkins 는 빌드별 콘솔 로그를 자체 UI 에 이미 보관한다
        #  - 모니터링 스택 자기 로그를 Loki 에 넣으면, Loki 가 못 받는 상황의 원인을 Loki 에서
        #    찾아야 하는 순환이 된다
        #
        # relabel 의 action: keep 을 쓰지 않는 이유(실측): 그렇게 하면 대상은 걸러지는데
        # Promtail 이 라벨 없는 스트림을 계속 밀어 넣어 Loki 가 400 을 뱉는다
        # ("at least one label pair is required per stream"). 도커 API 단계에서 거르면
        # 애초에 대상이 만들어지지 않아 그 문제가 없다.
        #
        # dev 도 보존하려면 이 필터를 지우고 relabel 로 스택을 나누는 대신,
        # docker_sd_configs 를 두 개(dev·prod) 두는 편이 안전하다.
        filters:
          - name: label
            values: ['com.docker.compose.project=woojuin-prod']
    relabel_configs:
      # 도커 컨테이너 이름은 앞에 /가 붙어 온다
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: stack
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
