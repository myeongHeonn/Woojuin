<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 팝업 창 테두리를 브라우저가 그릴 때 참고한다 — CSS 의 color-scheme 만으로는
         렌더 시점이 늦어 흰 테두리가 남는 경우가 있다. -->
    <meta name="color-scheme" content="dark" />
    <title>우주인에 저장</title>
    <!--
      Pretendard — 웹앱 디자인 토큰(--font-sans)의 첫 후보. 웹앱은 CDN 에서 불러 쓰지만
      @font-face 는 문서 단위라 확장이 그걸 재사용할 수 없어 직접 실었다.
      CDN 을 참조하지 않는 이유: 팝업을 열 때마다 외부 요청이 나가면 첫 렌더가 깜빡이고,
      웹스토어 심사에서도 원격 의존은 불리하다. 한글 서브셋 2 굵기(각 ~260KB)만 담았다.
      경로가 /fonts/... 인 이유: Vite 가 public/ 을 확장 루트로 복사하므로
      chrome-extension://<id>/fonts/... 로 풀린다.
      라이선스: fonts/Pretendard-OFL-LICENSE.txt (SIL OFL 1.1)
    -->
    <style>
      @font-face {
        font-family: 'Pretendard';
        font-weight: 400;
        font-display: block;
        src: url('/fonts/Pretendard-Regular.subset.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pretendard';
        font-weight: 600;
        font-display: block;
        src: url('/fonts/Pretendard-SemiBold.subset.woff2') format('woff2');
      }
      /* 배경색을 html 에도 두는 이유가 둘이다.
         ① 팝업이 뜨는 순간 React 가 그리기 전까지 흰 화면이 한 프레임 번쩍인다.
         ② body 에만 주면 팝업 창의 테두리(둥근 모서리 바깥)가 흰색으로 남는다 — Chrome 이
            html 배경을 팝업 바탕으로 쓰기 때문이다.
         color-scheme: dark 는 스크롤바·기본 폼 등 브라우저가 직접 그리는 부분까지 다크로 맞춘다.
         값은 웹앱의 --color-space. */
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0e1017; }
      body { min-width: 320px; }

      /* 저장 완료 전환 — 로고가 사라지며 체크가 그려진다.
         keyframes 는 인라인 style 로 만들 수 없어 여기 둔다. */
      @keyframes wj-fade-out {
        to { opacity: 0; transform: scale(0.82); }
      }
      @keyframes wj-mark-in {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes wj-ring-draw {
        from { stroke-dashoffset: 170; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes wj-check-draw {
        from { stroke-dashoffset: 30; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
  </body>
</html>
