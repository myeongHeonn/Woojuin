plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.ssafy'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 루트의 .env를 자동으로 읽어 환경변수로 주입 (별도 export 없이 bootRun 가능).
    // spring-dotenv(코어)는 수동 등록이 필요해 Boot 3 auto-registration이 되는
    // springboot3-dotenv를 써야 한다.
    implementation 'me.paulschwarz:springboot3-dotenv:5.1.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // 크롤링 / 본문 추출 (트랙 B)
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'net.dankito.readability4j:readability4j:1.0.8'

    // S3 업로드
    implementation 'software.amazon.awssdk:s3:2.29.52'

    // 이미지 썸네일 생성 (IMAGE 목록 카드용 저용량 webp). scrimage-webp는 리사이즈/webp
    // 인코딩에 번들 네이티브 바이너리(libwebp)를 쓴다 — Alpine(musl)/ARM에선 안 맞을 수
    // 있어, 생성 실패 시 목록은 원본 presigned로 폴백한다(ImageItemProcessor 참고).
    implementation 'com.sksamuel.scrimage:scrimage-core:4.3.0'
    implementation 'com.sksamuel.scrimage:scrimage-webp:4.3.0'

    // 사진 EXIF의 GPS 좌표 읽기 (IMAGE 아이템 지도 매핑, FR-023).
    // scrimage-core가 이미 같은 라이브러리를 같은 버전으로 끌어오지만 pom의 scope가 runtime이라
    // runtimeClasspath에만 올라온다 — compileClasspath엔 없어서 명시 선언 없이는 com.drew.*
    // import가 컴파일되지 않는다. scrimage가 쓰는 2.18.0에 맞춰 버전 스큐를 없앤다.
    implementation 'com.drewnoakes:metadata-extractor:2.18.0'

    // Swagger UI (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // DB 스키마 마이그레이션 (결정 #21). 기동 시 db/migration/V*.sql 을 순서대로 적용하고
    // flyway_schema_history 테이블에 이력을 남긴다 → "이 환경은 어디까지 적용됐나"를 조회 가능.
    // Flyway 10 부터 DB별 지원이 별도 모듈로 분리돼 postgresql 모듈을 함께 넣어야 한다
    // (없으면 "Unsupported Database: PostgreSQL" 로 기동 실패).
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // 웹 푸시 발송 (FCM). 서비스 계정 키가 없으면 NoOpPushSender로 폴백한다(PushSenderConfig).
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// spring-dotenv는 EnvironmentPostProcessor라서 application.yml이 다 읽히기 전에
// 실행된다 — springdotenv.directory를 application.yml에 적어도 무시된다.
// JVM 시스템 프로퍼티는 부팅 즉시 존재하는 프로퍼티 소스라 이 시점에도 보인다.
tasks.named('bootRun') {
    systemProperty 'springdotenv.directory', file("$rootDir/..").canonicalPath
}
